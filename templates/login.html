<!doctype html><html lang="pt-br"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#f3f4f8;margin:0}.box{max-width:420px;margin:8vh auto;background:white;padding:28px;border-radius:24px;box-shadow:0 8px 30px #0001}h1{color:#8b2bd1}input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #ccd}button{background:#8b2bd1;color:#fff;border:0;font-weight:bold}.err{background:#fee;padding:10px;border-radius:10px}</style><body><div class=box><h1>Portal do Candidato</h1><p>Miss e Mister Primavera 2026</p>{% with m=get_flashed_messages() %}{% if m %}<div class=err>{{m[0]}}</div>{% endif %}{% endwith %}<form method=post><input name=codigo placeholder="Código de acesso" required><input name=senha inputmode=numeric maxlength=4 placeholder="Senha de 4 dígitos" required><button>Entrar</button></form></div></body></html>
